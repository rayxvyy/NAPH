name: Build Windows Setup EXE

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Compile Bundled Windows P2P Engine (naph_p2p_win.exe)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "composeApp/src/desktopMain/resources/native/windows" | Out-Null
          Push-Location tools/p2p-win
          go mod tidy
          $env:CGO_ENABLED = "0"
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          go build -ldflags="-s -w -H=windowsgui" -o "../../composeApp/src/desktopMain/resources/native/windows/naph_p2p_win.exe" .
          Pop-Location
          Get-Item "composeApp/src/desktopMain/resources/native/windows/naph_p2p_win.exe" | Format-List Name, Length

      - name: Download & Bundle Official libmpv-2.dll (x86_64)
        shell: pwsh
        run: |
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/shinchiro/mpv-winbuild-cmake/releases/latest" -Headers @{ "User-Agent" = "NAPH-Builder" }
          $asset = $release.assets | Where-Object { $_.name -match "^mpv-dev-x86_64-.*\.7z$" -and $_.name -notmatch "v3" } | Select-Object -First 1
          if (-not $asset) {
            $asset = $release.assets | Where-Object { $_.name -match "^mpv-dev-x86_64.*\.7z$" } | Select-Object -First 1
          }
          if (-not $asset) {
            throw "Could not find mpv-dev-x86_64 .7z asset in shinchiro/mpv-winbuild-cmake releases"
          }
          Write-Host "Downloading $($asset.name)..."
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile "mpv-dev.7z"
          7z x mpv-dev.7z -ompv-extracted -y | Out-Null
          $dll = Get-ChildItem -Path "mpv-extracted" -Recurse -Filter "libmpv-2.dll" | Select-Object -First 1
          if (-not $dll) {
            throw "libmpv-2.dll not found inside $($asset.name)"
          }
          Copy-Item $dll.FullName "composeApp/src/desktopMain/resources/native/windows/libmpv-2.dll"
          Get-Item "composeApp/src/desktopMain/resources/native/windows/libmpv-2.dll" | Format-List Name, Length

      - name: Build Standalone Windows Setup Installer (.exe)
        shell: pwsh
        run: |
          .\gradlew.bat :composeApp:packageExe --console=plain
          New-Item -ItemType Directory -Force -Path dist-windows | Out-Null
          $exe = Get-ChildItem -Path "composeApp/build/compose/binaries/main/exe" -Filter "*.exe" | Select-Object -First 1
          if (-not $exe) {
            throw "No .exe installer produced by :composeApp:packageExe"
          }
          Copy-Item $exe.FullName "dist-windows/NAPH-1.0.0-windows-x64-setup.exe"
          Get-Item "dist-windows/NAPH-1.0.0-windows-x64-setup.exe" | Format-List Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: NAPH-1.0.0-windows-setup-exe
          path: dist-windows/NAPH-1.0.0-windows-x64-setup.exe

      - name: Attach Standalone Windows Setup EXE to release v1.0.0
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v1.0.0 dist-windows/NAPH-1.0.0-windows-x64-setup.exe --clobber
