name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Compile Native On-Device Android P2P Engine (arm64-v8a & x86_64)
        run: |
          mkdir -p composeApp/src/androidMain/jniLibs/arm64-v8a
          mkdir -p composeApp/src/androidMain/jniLibs/x86_64
          cd tools/p2p-win
          go mod tidy
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o ../../composeApp/src/androidMain/jniLibs/arm64-v8a/libnaph_p2p.so .
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o ../../composeApp/src/androidMain/jniLibs/x86_64/libnaph_p2p.so .
          ls -lh ../../composeApp/src/androidMain/jniLibs/*/libnaph_p2p.so

      - name: Build Signed Release Android APK
        run: |
          chmod +x gradlew
          ./gradlew :composeApp:assembleRelease --console=plain
          mkdir -p dist-android
          UNSIGNED_APK=$(find composeApp/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "Found release APK: $UNSIGNED_APK"

          # Sign with a clean self-signed release keystore so Android devices install it directly
          keytool -genkeypair -v \
            -keystore /tmp/naph-release.jks \
            -storepass naphrelease123 \
            -keypass naphrelease123 \
            -alias naph \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=NAPH, OU=Rayxvy, O=NAPH, L=Internet, S=Net, C=US"

          BUILD_TOOLS_DIR=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          "$BUILD_TOOLS_DIR/zipalign" -v -p 4 "$UNSIGNED_APK" /tmp/naph-aligned.apk
          "$BUILD_TOOLS_DIR/apksigner" sign \
            --ks /tmp/naph-release.jks \
            --ks-pass pass:naphrelease123 \
            --key-pass pass:naphrelease123 \
            --ks-key-alias naph \
            --out dist-android/NAPH-1.0.0-android.apk \
            /tmp/naph-aligned.apk

          "$BUILD_TOOLS_DIR/apksigner" verify dist-android/NAPH-1.0.0-android.apk
          ls -lh dist-android/NAPH-1.0.0-android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: NAPH-1.0.0-android-apk
          path: dist-android/NAPH-1.0.0-android.apk

      - name: Attach Android APK to release v1.0.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v1.0.0 dist-android/NAPH-1.0.0-android.apk --clobber
