name: Build iOS IPA

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios-ipa:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Build IPA
        run: |
          chmod +x ./gradlew ./iosApp/build-ipa.sh
          ./iosApp/build-ipa.sh

      - name: Sanity check (real arm64 executable inside, not a stub)
        run: |
          file iosApp/build/Payload/NAPH.app/NAPH | grep -q "Mach-O 64-bit executable arm64"
          SIZE=$(stat -f%z iosApp/build/NAPH-1.0.0-ios-arm64.ipa)
          echo "IPA size: $SIZE bytes"
          test "$SIZE" -gt 10000000

      - uses: actions/upload-artifact@v4
        with:
          name: NAPH-1.0.0-ios-arm64
          path: iosApp/build/NAPH-1.0.0-ios-arm64.ipa

      - name: Attach to release v1.0.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload v1.0.0 iosApp/build/NAPH-1.0.0-ios-arm64.ipa --clobber
